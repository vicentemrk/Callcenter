{% extends "componentes/header.html" %}
{% load static %}
{% block links%}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="mainLogin">
    <h2>Iniciar sesión</h2>
    <form id="Formulario" method="POST">
        {{form}}
        {% csrf_token %}
        <input value="Iniciar Sesion" type="submit">
    </form>
    <p>¿Aun no tienes cuenta? <a href="{% url 'Register' %}">Registrate ya!</a></p>
</div>
{% endblock %}
